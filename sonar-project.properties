# SonarCloud configuration for AI Note Taker
# https://sonarcloud.io/

sonar.projectKey=shyamsunderprogramer-design_ai-note-taker
sonar.organization=shyamsunderprogramer-design

# Source directories
sonar.sources=backend/core,backend/modules,backend/api,backend/security,electron
sonar.tests=backend/tests

# Language-specific settings
sonar.python.version=3.11

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**,**/venv/**,**/.venv/**,**/data/**,**/*.min.js,**/coverage/**,**/build/**
sonar.test.exclusions=**/tests/**,**/*_test.py,**/*_test.js,**/*Test.js

# Coverage
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=electron/coverage/lcov.info

# Duplicate detection exclusions
sonar.cpd.exclusions=**/node_modules/**,**/dist/**,**/data/**,**/tests/**

# Quality gates
sonar.qualitygate.wait=true

# Source encoding
sonar.sourceEncoding=UTF-8