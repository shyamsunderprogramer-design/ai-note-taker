<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
      margin: 0;
    }
    .header {
      text-align: center;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #333;
    }
    .logo {
      font-size: 24px;
      margin-bottom: 5px;
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      background: linear-gradient(135deg, #10b981, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 15px;
      font-size: 13px;
    }
    .status.detected {
      border-left: 3px solid #10b981;
    }
    .status.not-detected {
      border-left: 3px solid #f59e0b;
    }
    .job-info {
      margin-bottom: 15px;
    }
    .job-field {
      margin-bottom: 10px;
    }
    .job-field label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 3px;
    }
    .job-field input {
      width: 100%;
      padding: 8px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #0a0a0a;
      color: #fff;
      font-size: 13px;
      box-sizing: border-box;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #10b981, #3b82f6);
      color: white;
    }
    .btn-primary:hover {
      opacity: 0.9;
    }
    .btn-primary:disabled {
      background: #333;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #fff;
      margin-top: 8px;
    }
    .success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid #10b981;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      display: none;
    }
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #ef4444;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🐜</div>
    <div class="title">ANT Job Capture</div>
  </div>

  <div id="statusBox" class="status not-detected">
    👆 Navigate to a job posting on LinkedIn, Indeed, or Glassdoor
  </div>

  <div id="jobForm" class="job-info" style="display: none;">
    <div class="job-field">
      <label>Company</label>
      <input type="text" id="companyInput" placeholder="Company name">
    </div>
    <div class="job-field">
      <label>Role</label>
      <input type="text" id="roleInput" placeholder="Job title">
    </div>
    <div class="job-field">
      <label>Location</label>
      <input type="text" id="locationInput" placeholder="City, State">
    </div>
  </div>

  <button id="captureBtn" class="btn btn-primary" disabled>Capture Job</button>
  <button id="openAppBtn" class="btn btn-secondary">Open ANT App</button>

  <div id="successMsg" class="success">
    ✅ Job captured successfully!
  </div>
  <div id="errorMsg" class="error"></div>

  <script src="popup.js"></script>
</body>
</html>
