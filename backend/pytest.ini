[pytest]
# ANT backend pytest configuration.
# Created 2026-06-05 (Fix #17 of the project audit). Centralizes the
# `asyncio_mode = auto` flag that was previously passed via the CLI in
# .github/workflows/ci.yml — test_api_integration.py defines
# `async def test_*` without @pytest.mark.asyncio markers, so the
# auto mode is required for the integration suite to collect.
asyncio_mode = auto

# Default discovery paths. The CI workflow also runs
# `core/test_startup.py` which lives outside `tests/`, so the workflow
# still passes explicit paths to pytest.
testpaths = tests

# Match the existing dominant pattern: file names like test_*.py,
# class names like Test*, function names like test_*. These are the
# pytest defaults but they are pinned here for clarity.
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Marker registration. Adding a marker here silences the
# "PytestUnknownMarkWarning" and documents the project's intent.
markers =
    integration: requires a live uvicorn server on http://127.0.0.1:8000

# A small set of warning suppressions. The backend imports several
# third-party libs (passlib, cryptography) that emit deprecation
# warnings on Python 3.12; silencing them keeps pytest output
# focused on real test failures. Each filter is scoped tightly so
# genuine deprecations in our own code still surface.
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:bcrypt.*
