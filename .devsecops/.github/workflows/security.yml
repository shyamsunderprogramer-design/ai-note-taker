# Security Scanning Pipeline - Runs independently
# Scheduled: Daily at 2 AM, plus on-demand

name: Security Scan

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of scan'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - sca
          - sast
          - container
          - secrets
  push:
    branches:
      - main
      - develop

env:
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # SNYK SCA (Software Composition Analysis)
  # ═══════════════════════════════════════════════════════════════════════
  snyk-sca:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'sca'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Snyk Test (Python)
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk Test (Node.js)
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk JSON report
        uses: actions/upload-artifact@v4
        with:
          name: snyk-json-report
          path: snyk_results.json

      - name: Create GitHub Issue on vulnerabilities
        if: github.event_name == 'schedule'
        uses: snyk/actions/github-issue-class@v1
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          type: vuln

  # ═══════════════════════════════════════════════════════════════════════
  # TRIVY CONTAINER SCAN
  # ═══════════════════════════════════════════════════════════════════════
  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'container'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ github.repository_owner }}/ant-backend:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          security-checks: 'vulnerability,config,secret'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif

  # ═══════════════════════════════════════════════════════════════════════
  # GITLEAKS SECRET SCAN
  # ═══════════════════════════════════════════════════════════════════════
  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'secrets'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG_PATH: .devsecops/gitleaks.toml

      - name: Upload GitLeaks results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: glcie.json

  # ═══════════════════════════════════════════════════════════════════════
  # CHECKOV INFRASTRUCTURE SCAN
  # ═══════════════════════════════════════════════════════════════════════
  checkov-iac:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'sast'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: terraform
          output_format: sarif

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  # ═══════════════════════════════════════════════════════════════════════
  # FALCO RUNTIME SECURITY
  # ═══════════════════════════════════════════════════════════════════════
  falco:
    name: Runtime Security Monitor
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all'
    steps:
      - name: Setup Falco
        run: |
          curl -s https://falco.org/repo/falcosecurity-packages.asc | apt-key add -
          echo "deb https://download.falco.org/packages/deb stable main" | tee /etc/apt/sources.list.d/falcosecurity.list
          apt-get update -y
          apt-get install -y falco

      - name: Run Falco
        run: |
          falco \
            --dry-run \
            --mode=audit-log \
            --userspace \
            &
          sleep 5
          echo "Falco running in audit mode"

  # ═══════════════════════════════════════════════════════════════════════
  # SONARQUBE SECURITY SCAN
  # ═══════════════════════════════════════════════════════════════════════
  sonarqube-security:
    name: SonarQube Security
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'sast'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SonarCloud Security Sweep
        uses: sonarsource/sonarcloud-github-action@v2
        with:
          projectBaseDir: .
          extraProperties: |
            sonar.security.config.sealed=true
            sonar.sast.enabled=true

  # ═══════════════════════════════════════════════════════════════════════
  # DEPENDABOT ALERTS AGGREGATION
  # ═══════════════════════════════════════════════════════════════════════
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate dependency tree
        run: |
          pip install pipdeptree
          pipdeptree --warn fail > dependency_tree.txt || true

      - name: Check for vulnerable dependencies
        run: |
          curl -s https://api.github.com/dependabot/updates \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" | \
            jq '.[] | select(.security_vulnerability)'

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependency_tree.txt
