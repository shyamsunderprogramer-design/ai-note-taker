# Release Management Pipeline
# Manages semantic versioning, changelog generation, and release artifacts

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version (e.g., 1.0.0) or "patch"/"minor"/"major" for bump'
        required: true
        default: 'patch'
      changelog:
        description: 'Custom changelog notes (optional)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository_owner }}/ant-backend
  IMAGE_NAME_ELECTRON: ${{ github.repository_owner }}/ant-electron

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # VERSION BUMP
  # ═══════════════════════════════════════════════════════════════════════
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          IS_RELEASE="false"

          # Check if it's a bump keyword
          case "$VERSION" in
            patch|minor|major)
              # Get current version from tags
              CURRENT=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
              echo "Current version: $CURRENT"

              # Split version
              IFS='.' read -r Major Minor Patch <<< "$CURRENT"
              echo "Major=$Major Minor=$Minor Patch=$Patch"

              case "$VERSION" in
                patch) NewPatch=$((Patch + 1)); NewMinor=$Minor; NewMajor=$Major ;;
                minor) NewMinor=$((Minor + 1)); NewPatch=0; NewMajor=$Major ;;
                major) NewMajor=$((Major + 1)); NewMinor=0; NewPatch=0 ;;
              esac

              VERSION="$NewMajor.$NewMinor.$NewPatch"
              IS_RELEASE="true"
              ;;
          esac

          # Validate version format
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "::set-output name=version::$VERSION"  # Legacy
          echo "::set-output name=is_release::$IS_RELEASE"

  # ═══════════════════════════════════════════════════════════════════════
  # CHANGELOG GENERATION
  # ═══════════════════════════════════════════════════════════════════════
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: [version]
    if: needs.version.outputs.is_release == 'true'
    outputs:
      changelog: ${{ steps.changelog.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          VERSION=${{ needs.version.outputs.version }}

          # Generate changelog using git changelog
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" \
            $(git describe --tags --abbrev=0 HEAD)...HEAD 2>/dev/null || echo "")

          # Add custom notes if provided
          if [[ -n "${{ github.event.inputs.changelog }}" ]]; then
            CHANGELOG="$CHANGELOG"$'\n\n'"${{ github.event.inputs.changelog }}"
          fi

          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "## What's Changed" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/...$VERSION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # ═══════════════════════════════════════════════════════════════════════
  # BUILD & TAG
  # ═══════════════════════════════════════════════════════════════════════
  build:
    name: Build & Tag Release
    runs-on: ubuntu-latest
    needs: [version, changelog]
    if: needs.version.outputs.is_release == 'true'
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_ELECTRON }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Update Helm chart version
        run: |
          # Update Chart.yaml
          sed -i "s/appVersion:.*/appVersion: \"${{ needs.version.outputs.version }}\"/" k8s/helm/backend/Chart.yaml
          sed -i "s/version:.*/version: ${{ needs.version.outputs.version }}/" k8s/helm/backend/Chart.yaml

          # Commit version bump
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/helm/backend/Chart.yaml
          git commit -m "chore: bump chart version to ${{ needs.version.outputs.version }}"
          git tag -a v${{ needs.version.outputs.version }} -m "Release v${{ needs.version.outputs.version }}"
          git push --follow-tags

  # ═══════════════════════════════════════════════════════════════════════
  # CREATE GITHUB RELEASE
  # ═══════════════════════════════════════════════════════════════════════
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, changelog, build]
    if: needs.version.outputs.is_release == 'true'
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Release v${{ needs.version.outputs.version }}
          body: ${{ needs.changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, 'alpha') || contains(needs.version.outputs.version, 'beta') }}
          files: |
            backend-bom.xml
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM to Release
        uses: actions/upload-release-artifact@v4
        with:
          name: sbom-v${{ needs.version.outputs.version }}
          path: backend-bom.xml
          release_id: ${{ steps.create_release.outputs.id }}

  # ═══════════════════════════════════════════════════════════════════════
  # SLACK NOTIFICATION
  # ═══════════════════════════════════════════════════════════════════════
  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [version, release]
    if: needs.version.outputs.is_release == 'true'
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v2
        with:
          channel-id: ${{ vars.RELEASE_CHANNEL }}
          payload: |
            {
              "text": "🎉 New Release Published",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🎉 ANT Release v${{ needs.version.outputs.version }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Version:\* v${{ needs.version.outputs.version }}\n*Author:\* ${{ github.actor }}\n*Release Notes:\* <${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ needs.version.outputs.version }}|View Release>"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      - name: Create Jira Release
        if: vars.JIRA_PROJECT_KEY != ''
        run: |
          curl -X POST "${{ secrets.JIRA_URL }}/rest/api/3/version" \
            -H "Authorization: Basic ${{ secrets.JIRA_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "project": "${{ vars.JIRA_PROJECT_KEY }}",
              "name": "v${{ needs.version.outputs.version }}",
              "released": true,
              "releaseDate": "'$(date +%Y-%m-%d)'"
            }'
        continue-on-error: true
