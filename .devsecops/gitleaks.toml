# GitLeaks Configuration - Secrets Detection
# https://github.com/gitleaks/gitleaks

[options]
  verbose = true
  emit = ["json", "stdout"]
  no-color = false
  fail = true
  log-level = "info"

[allowlist]
  description = "Allowed secrets for testing"
  paths = [
    "**/test/**",
    "**/__pycache__/**",
    "**/*.test.js",
    "**/node_modules/**",
  ]

  # Fake/test keys that should never be real
  regexes = [
    '(?i)sk_test_[0-9a-z]{32}',  # Stripe test key pattern
    '(?i)AKIA[0-9A-Z]{16}',      # AWS test key pattern
    'xox[baprs]-[0-9a-zA-Z]{10,48}',  # Slack token pattern (fake)
    'ghp_[0-9a-zA-Z]{36}',       # GitHub personal token (not real)
    'glpat-[0-9a-zA-Z\-]{20}',   # GitLab token (not real)
  ]

[[rules]]
  id = "aws-access-key"
  description = "AWS Access Key"
  regex = '''AKIA[0-9A-Z]{16}'''
  secretGroup = 1

[[rules]]
  id = "aws-secret-key"
  description = "AWS Secret Access Key"
  regex = '''(?i)(aws_secret_access_key|aws_secret_key)\s*[:=]\s*['\"][0-9a-zA-Z\/+]{40}['\"]'''

[[rules]]
  id = "github-token"
  description = "GitHub Personal Access Token"
  regex = '''ghp_[0-9a-zA-Z]{36}'''

[[rules]]
  id = "gitlab-token"
  description = "GitLab Personal Access Token"
  regex = '''glpat-[0-9a-zA-Z\-]{20}'''

[[rules]]
  id = "slack-token"
  description = "Slack Token"
  regex = '''xox[baprs]-[0-9a-zA-Z]{10,48}'''

[[rules]]
  id = "stripe-api-key"
  description = "Stripe API Key"
  regex = '''sk_live_[0-9a-zA-Z]{24}'''

[[rules]]
  id = "stripe-test-key"
  description = "Stripe Test API Key"
  regex = '''sk_test_[0-9a-zA-Z]{24}'''

[[rules]]
  id = "openai-api-key"
  description = "OpenAI API Key"
  regex = '''sk-[0-9a-zA-Z]{48}'''

[[rules]]
  id = "anthropic-api-key"
  description = "Anthropic API Key"
  regex = '''sk-ant-[0-9a-zA-Z\-]{50,}'''

[[rules]]
  id = "azure-storage-key"
  description = "Azure Storage Account Key"
  regex = '''(?i)DefaultEndpointsProtocol=https;AccountName=[^;]+;AccountKey=[^;]+'''

[[rules]]
  id = "sendgrid-api-key"
  description = "SendGrid API Key"
  regex = '''SG\.[0-9a-zA-Z\-]{22}\.[0-9a-zA-Z\-]{43}'''

[[rules]]
  id = "twilio-api-key"
  description = "Twilio API Key"
  regex = '''SK[0-9a-fA-F]{32}'''

[[rules]]
  id = "database-url"
  description = "Database Connection String"
  regex = '''(postgres|mysql|postgresql|mongodb)://[^:]+:[^@]+@'''

[[rules]]
  id = "private-key"
  description = "Private Key"
  regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''

[[rules]]
  id = "generic-api-key"
  description = "Generic API Key"
  regex = '''(?i)(api[_-]?key|apikey|secret[_-]?key)\s*[:=]\s*['\"][0-9a-zA-Z]{20,}['\"]'''

[[rules]]
  id = "generic-secret"
  description = "Generic Secret"
  regex = '''(?i)(password|passwd|pwd|secret|token)\s*[:=]\s*['\"][^'\"]{8,}['\"]'''

[[rules]]
  id = "jwt-token"
  description = "JWT Token"
  regex = '''eyJ[A-Za-z0-9\-_]+\.eyJ[A-Za-z0-9\-_]+\.[A-Za-z0-9\-_]+'''
