name: Scan complete Git history
description: Scan reachable history, including roots and merge resolutions, with pinned Gitleaks.
runs:
  using: composite
  steps:
    - name: Install verified Gitleaks
      shell: bash
      run: |
        curl --fail --silent --show-error --location --max-time 60 \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
          --output "$RUNNER_TEMP/gitleaks.tar.gz"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
    - name: Scan all reachable commits and merge changes
      shell: bash
      run: |
        "$RUNNER_TEMP/gitleaks" git --redact --no-banner \
          --config .github/gitleaks.toml \
          --log-opts='--full-history --diff-merges=first-parent HEAD' \
          --report-format sarif --report-path gitleaks-results.sarif
    - name: Preserve redacted scan report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gitleaks-report
        path: gitleaks-results.sarif
        if-no-files-found: error
        retention-days: 7
