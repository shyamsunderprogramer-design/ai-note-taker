name: CI

on:
  push:
    branches: [main, develop, 'phase*', 't*']
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # ====================
  # LINT
  # ====================
  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./electron

      - name: ESLint
        run: npx eslint . --ext .js
        working-directory: ./electron

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install flake8
        working-directory: ./backend

      - name: Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        working-directory: ./backend

  # ====================
  # TEST
  # ====================
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: ./backend

      - name: Pytest
        run: |
          pip install pytest pytest-asyncio pytest-cov httpx
          pytest backend/tests/ -v --tb=short
        working-directory: ./backend

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage.xml

  # ====================
  # BUILD ELECTRON
  # ====================
  build-electron:
    name: Build Electron
    runs-on: windows-latest
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: win
            electron_arch: x64
          - os: macos-latest
            artifact_name: mac
            electron_arch: x64
          - os: ubuntu-latest
            artifact_name: linux
            electron_arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./electron

      - name: Build Electron App
        run: npm run build
        working-directory: ./electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ant-electron-${{ matrix.artifact_name }}
          path: |
            electron/dist/**/*.exe
            electron/dist/**/*.dmg
            electron/dist/**/*.AppImage
          retention-days: 14

  # ====================
  # BUILD BACKEND
  # ====================
  build-backend:
    name: Build Backend
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
        working-directory: ./backend

      - name: Build executable
        run: |
          pyinstaller --onefile --name ANTBackend main.py
        working-directory: ./backend

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ant-backend-win
          path: backend/dist/ANTBackend.exe
          retention-days: 14

  # ====================
  # RELEASE
  # ====================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-electron, build-backend]
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Electron artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/electron

      - name: Download Backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: ant-backend-win
          path: dist/backend

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/electron/**/*.exe
            dist/electron/**/*.dmg
            dist/electron/**/*.AppImage
            dist/backend/ANTBackend.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
