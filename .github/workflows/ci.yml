name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workflow-validation:
    name: Workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions syntax
        run: |
          curl --fail --silent --show-error --location --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest core/test_startup.py tests/ --tb=short -v
      - name: Test release verification gates
        run: python -m unittest discover -s scripts/tests -v

  web-build:
    name: Web and desktop tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked workspace dependencies
        run: npm ci
      - name: Verify dependency security regressions
        run: npm run test:security
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low
      - name: Verify desktop, web and mobile unit tests
        run: |
          npm --workspace ai-note-taker test
          npm --workspace ant-web test
          npm --workspace ant-mobile test -- --runInBand --watchman=false
      - name: Build web application
        run: npm run web:build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-tests, web-build, workflow-validation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked workspace and browser dependencies
        run: |
          npm ci
          npm --workspace ant-e2e-tests run install:browsers -- --with-deps
      - name: Run browser tests
        working-directory: e2e
        env:
          CI: 'true'
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/html-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

  security-scan:
    name: Security (bandit, pip-audit, gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-security.txt
      - name: Install security tooling
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-security.txt
      - name: Check high-severity Python security findings
        working-directory: backend
        run: |
          bandit -r . --skip B101,B601 \
            --severity-level high --confidence-level high \
            --exclude ./venv,./node_modules,./__pycache__ \
            --format json --output bandit-report.json
      - name: Audit Python dependencies
        working-directory: backend
        run: pip-audit --requirement requirements.txt --format json --output pip-audit-report.json
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-and-python-security-reports
          path: |
            backend/bandit-report.json
            backend/pip-audit-report.json
          retention-days: 7
          if-no-files-found: error
      - name: Scan for secrets
        uses: ./.github/actions/scan-secrets
