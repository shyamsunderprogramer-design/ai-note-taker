# ANT AI Note Taker - Production CI Pipeline
# Triggers: push to main/develop/phase*/t*, PRs, releases, manual dispatch
# Features: lint, test, security scan, container build, Electron multi-OS build

name: CI

on:
  push:
    branches: [main, develop, 'phase*', 't*']
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test execution'
        type: boolean
        default: false
      skip_security:
        description: 'Skip security scans'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository_owner }}/ant-backend

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # LINT & FORMAT CHECK
  # ═══════════════════════════════════════════════════════════════════════
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Python Linting ───────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install Python linters
        run: pip install flake8 flake8-bugbear black isort

      - name: Run Flake8 (critical errors only)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        working-directory: ./backend

      - name: Run Black (check mode)
        run: black --check --diff backend/ || true
        continue-on-error: true

      - name: Run isort (check mode)
        run: isort --check-only --diff backend/ || true
        continue-on-error: true

      # ─── JavaScript/Node Linting ────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install Node dependencies
        run: npm ci
        working-directory: ./electron

      - name: Run ESLint
        run: npx eslint . --ext .js
        working-directory: ./electron

      # ─── IaC Scanning ─────────────────────────────────────────────────
      - name: Run Checkov (Terraform security)
        run: |
          pip install checkov
          for dir in infrastructure/terraform/*/; do
            if [ -d "$dir" ]; then
              echo "Scanning $dir"
              checkov -d "$dir" --compact --quiet || true
            fi
          done
        continue-on-error: true

      # ─── Dockerfile Linting ────────────────────────────────────────────
      - name: Hadolint (Dockerfile lint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.backend
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════
  # TEST
  # ═══════════════════════════════════════════════════════════════════════
  test:
    name: Test
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && inputs.skip_tests != true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-mock httpx
        working-directory: ./backend

      - name: Run Pytest with coverage
        run: |
          pytest tests/ -v --tb=short --cov=. --cov-report=xml --cov-report=term-missing || true
        working-directory: ./backend
        env:
          USE_SQLITE: "true"
          FORCE_SQLITE: "true"
          TESTING: "true"
          AUTH_REQUIRED: "false"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════
  # SONARCLOUD CODE QUALITY
  # ═══════════════════════════════════════════════════════════════════════
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event.inputs.skip_security != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # SECRET SCANNING
  # ═══════════════════════════════════════════════════════════════════════
  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    if: inputs.skip_security != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml

  # ═══════════════════════════════════════════════════════════════════════
  # CONTAINER BUILD & SCAN
  # ═══════════════════════════════════════════════════════════════════════
  container-build:
    name: Build & Scan Container
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        if: github.event_name != 'pull_request'
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: github.event_name != 'pull_request'
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════
  # SNYK DEPENDENCY SCAN
  # ═══════════════════════════════════════════════════════════════════════
  snyk:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest
    needs: [lint]
    if: inputs.skip_security != 'true'
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Snyk (Python)
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Run Snyk (Node.js)
        uses: snyk/actions/node@master
        continue-on-error: true
        with:
          command: test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ═══════════════════════════════════════════════════════════════════════
  # SBOM GENERATION
  # ═══════════════════════════════════════════════════════════════════════
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate Python SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements \
            --format xml \
            --output-file backend-bom.xml
        working-directory: ./backend

      - name: Generate Node.js SBOM (CycloneDX)
        run: |
          npm install -g @cyclonedx/cyclonedx-npm
          cyclonedx-npm --output-format xml --output-file ../../node-bom.xml
        working-directory: ./electron

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            backend/backend-bom.xml
            node-bom.xml
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════════════
  # BUILD ELECTRON (Multi-OS)
  # ═══════════════════════════════════════════════════════════════════════
  build-electron:
    name: Build Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: win
            build_cmd: npm run build:win
          - os: macos-latest
            artifact_name: mac
            build_cmd: npm run build:mac
          - os: ubuntu-latest
            artifact_name: linux
            build_cmd: npm run build:linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libsoup2.4-dev libappindicator3-dev libxtst-dev

      - name: Install dependencies
        run: npm ci
        working-directory: ./electron

      - name: Build Electron App
        run: ${{ matrix.build_cmd }}
        working-directory: ./electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ant-electron-${{ matrix.artifact_name }}
          path: |
            electron/dist/**/*.exe
            electron/dist/**/*.dmg
            electron/dist/**/*.AppImage
            electron/dist/**/*.deb
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════
  # BUILD BACKEND (PyInstaller)
  # ═══════════════════════════════════════════════════════════════════════
  build-backend:
    name: Build Backend
    runs-on: windows-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
        working-directory: ./backend

      - name: Build executable
        run: pyinstaller --onefile --name ANTBackend core/main.py
        working-directory: ./backend

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ant-backend-win
          path: backend/dist/ANTBackend.exe
          retention-days: 14