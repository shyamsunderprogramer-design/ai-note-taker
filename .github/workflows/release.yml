name: Release

# Trigger: a tag matching `v*.*.*` (e.g. v2.1.0, v2.2.0-rc1).
#
# What it does:
#   1. Builds the Electron desktop app for all 3 platforms in parallel.
#   2. Uploads each platform's installers to the GitHub release that
#      corresponds to the tag (creating one if `gh release create`
#      wasn't run beforehand).
#   3. Computes SHA256SUMS.txt and uploads it too.
#
# Local alternative: `scripts/release.sh` — runs the same steps on
# the developer's machine and pushes the tag, which then triggers
# THIS workflow for a clean CI build. The local-only path is useful
# for testing the build before tagging.
#
# Why this exists: before this workflow, building installers required
# a developer with Wine + a Mac + Linux all set up locally. Now any
# `git tag v*.*.* && git push --tags` produces all 3 platforms.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Cancel in-flight re-runs of the same tag, but never cancel a
# release that's already started uploading — that's irreversible.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Needs write to upload release assets. Scope GITHUB_TOKEN down to
# only what's required so a compromised dep can't push to the repo.
permissions:
  contents: write

jobs:
  # ───────────────────────────────────────────────────────────
  # Stage 1: matrix of platform builds. Each runner builds
  # installers natively for its platform (no cross-compile).
  # ───────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_target: --linux
            artifact_glob: |
              electron/dist/ANT*.AppImage
              electron/dist/ANT*.deb
          - os: macos-latest
            build_target: --mac
            artifact_glob: |
              electron/dist/ANT*.dmg
              electron/dist/ANT*.zip
              electron/dist/ANT*-mac-*.zip
          - os: windows-latest
            build_target: --win
            artifact_glob: |
              electron/dist/ANT*Setup*.exe
              electron/dist/ANT*win*.exe

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install electron deps
        # Electron-builder needs the dev deps in electron/node_modules.
        # We don't run `npm install` at the monorepo root because the
        # other workspaces (apps/web, mobile, e2e) pull in heavy deps
        # that aren't needed for the desktop build.
        #
        # `--no-workspaces` is required: the monorepo root has no
        # package-lock.json (intentionally — see .gitignore). Without
        # this flag, npm walks up from electron/ to the root, sees the
        # workspaces declaration in the root package.json, and refuses
        # to install ("npm ci can only install with an existing
        # package-lock.json"). Treat electron/ as a standalone package.
        working-directory: electron
        run: npm ci --no-workspaces

      - name: Generate icons (Linux/macOS only — Windows doesn't need .ico)
        # electron-builder will fall back to the default Electron icon
        # if `assets/icon.ico` is missing on Windows, but `assets/icon.icns`
        # is required for the macOS DMG. Generate both for safety.
        #
        # shell: bash — the Windows runner defaults to PowerShell, but
        # the `if [ ! -f ... ]` test is POSIX-bash syntax. On Windows
        # the if-guard evaluates to false anyway (icon.ico + icon.icns
        # are both committed), so the step is a no-op there — but the
        # parse error still aborts the step. Force bash to keep the
        # step syntactically valid across all 3 runners.
        working-directory: electron
        shell: bash
        run: |
          if [ ! -f assets/icon.ico ] || [ ! -f assets/icon.icns ]; then
            npm install --no-save sharp png-to-ico
            npm run icons
          fi

      - name: Build installers
        working-directory: electron
        env:
          # Disable code signing on CI — releases are unsigned.
          # CSC_LINK / CSC_KEY_PASSWORD are empty; electron-builder
          # skips signing when both are unset.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Skip macOS notarization (we're unsigned).
          APPLE_ID: ''
          APPLE_APP_SPECIFIC_PASSWORD: ''
          APPLE_TEAM_ID: ''
          # electron-builder sees a `publish` block in electron/package.json
          # and demands GH_TOKEN. We don't want it publishing during the
          # build (the dedicated `publish` job below attaches assets via
          # softprops/action-gh-release). Setting GH_TOKEN here suppresses
          # the "Personal Access Token is not set" error that otherwise
          # breaks macOS builds. `--publish never` on the build command
          # (below) ensures electron-builder never tries to push even
          # with a token set.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN || 'unused' }}
        # Build only the platform matching this matrix runner. The
        # earlier `electron-builder -mwl` invocation built all three
        # platforms on every runner — wasteful (3x downloads of
        # Electron + native deps) and caused the publish job to receive
        # three overlapping artifact bundles, which
        # softprops/action-gh-release@v2 then refused to attach with
        # `fail_on_unmatched_files: true`. Per-runner targets keep the
        # artifact sets disjoint.
        run: npx electron-builder ${{ matrix.build_target }} --publish never

      - name: List dist output (sanity check)
        # NOTE: this step is informational only. The earlier
        # `ls -lh ${{ matrix.artifact_glob }}` approach failed in CI
        # because (a) the YAML value for artifact_glob is multi-line,
        # which GitHub Actions interpolated as actual newlines into
        # the shell script — splitting one bash line into four; and
        # (b) `bash -e` then exited on the first failed `ls`. We
        # sidestep both by just listing `dist/` directly.
        #
        # shell: bash — Windows runner defaults to PowerShell, but
        # the find/ls idiom below is bash syntax. Same reason as the
        # icon-gen step above.
        working-directory: electron
        shell: bash
        run: |
          echo "==> dist/ contents:"
          ls -lh dist/ 2>&1 || true
          echo "==> installer files:"
          find dist -maxdepth 1 -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.exe" \) -exec ls -lh {} \; || true

      - name: Upload artifacts (for the upload job to consume)
        # NOTE: `path` accepts a YAML literal scalar — each line is
        # a separate glob. The earlier form
        #   path: |
        #     electron/dist/${{ matrix.artifact_glob }}
        #     electron/dist/SHA256SUMS.txt
        # failed because `matrix.artifact_glob` itself is multi-line,
        # so the interpolation only prefixed `electron/dist/` onto
        # the FIRST glob line, leaving the rest as bare relative
        # paths (which resolved against `electron/`, not
        # `electron/dist/`, and matched nothing).
        #
        # The fix: bake `electron/dist/` into every matrix glob so
        # the path here can be a simple list with no interpolation.
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            ${{ matrix.artifact_glob }}
            electron/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────────────────────────────────────
  # Stage 2: take all 3 artifact bundles, attach to the release.
  # Runs only after every matrix job succeeds.
  # ───────────────────────────────────────────────────────────
  publish:
    name: Publish to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what we got
        run: |
          echo "==> artifacts/ contents:"
          ls -lh artifacts/ || true

      - name: Generate SHA256SUMS.txt (combine with anything the build produced)
        # The download-artifact step (above) extracts the matrix
        # zips directly into `artifacts/` (the path strip happens
        # because each upload-artifact's path was rooted at
        # `electron/dist/`, but download-artifact collapses that
        # to the basename of the matched file). Compute SHA256
        # across all of them, then attach the resulting file to
        # the release.
        #
        # NB: an earlier version used `working-directory:
        # artifacts/electron/dist` — that path doesn't exist on
        # this job because the upload globs already include the
        # full `electron/dist/` prefix (see matrix.artifact_glob),
        # so download-artifact sees the installer's basename only.
        working-directory: artifacts
        run: |
          # Recompute hashes from the files we have on disk
          sha256sum *.exe *.dmg *.zip *.AppImage *.deb 2>/dev/null > SHA256SUMS.txt || true
          echo "==> SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Don't overwrite an existing release body — if the tag was
          # pushed via `gh release create` first (preferred), the body
          # is already curated. Only attach files.
          #
          # NOTE: each matrix runner's upload-artifact zips up
          # `electron/dist/<installer>` files with the `electron/dist/`
          # path preserved. download-artifact@v4 (with merge-multiple)
          # extracts them all into the same `artifacts/` directory;
          # the `electron/dist/` prefix is dropped because the action
          # normalizes the path to the matched files' basename. So
          # the installers end up directly in `artifacts/` and the
          # release-upload globs target them there.
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/SHA256SUMS.txt
          # generate_release_notes: true appends GitHub's auto-generated
          # changelog (PR list + author credits) below whatever body
          # the maintainer wrote. Helpful, low-risk.
          generate_release_notes: true
          fail_on_unmatched_files: true
          # If the release doesn't exist yet, create it as a draft.
          # Maintainer promotes it to public via the web UI.
          draft: true