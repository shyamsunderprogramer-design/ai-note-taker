name: Release

# Trigger: a tag matching `v*.*.*` (e.g. v2.1.0, v2.2.0-rc1).
#
# What it does:
#   1. Builds the Electron desktop app for all 3 platforms in parallel.
#   2. Uploads each platform's installers to the GitHub release that
#      corresponds to the tag (creating one if `gh release create`
#      wasn't run beforehand).
#   3. Computes SHA256SUMS.txt and uploads it too.
#
# Local alternative: `scripts/release.sh` — runs the same steps on
# the developer's machine and pushes the tag, which then triggers
# THIS workflow for a clean CI build. The local-only path is useful
# for testing the build before tagging.
#
# Why this exists: before this workflow, building installers required
# a developer with Wine + a Mac + Linux all set up locally. Now any
# `git tag v*.*.* && git push --tags` produces all 3 platforms.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Cancel in-flight re-runs of the same tag, but never cancel a
# release that's already started uploading — that's irreversible.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Needs write to upload release assets. Scope GITHUB_TOKEN down to
# only what's required so a compromised dep can't push to the repo.
permissions:
  contents: write

jobs:
  # ───────────────────────────────────────────────────────────
  # Stage 1: matrix of platform builds. Each runner builds
  # installers natively for its platform (no cross-compile).
  # ───────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_target: --linux
            artifact_glob: |
              electron/dist/ANT*.AppImage
              electron/dist/ANT*.deb
          - os: macos-latest
            build_target: --mac
            artifact_glob: |
              electron/dist/ANT*.tar.gz
              electron/dist/ANT*.zip
              electron/dist/ANT*-mac-*.zip
          - os: windows-latest
            build_target: --win
            artifact_glob: |
              electron/dist/ANT*Setup*.exe
              electron/dist/ANT*win*.exe

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Set up Python 3.12
        # Required for the "Build native Python venv" step below.
        # cache: 'pip' with the production requirements.txt key reuses
        # the wheel cache from the e2e job in ci.yml — saves ~5 min on
        # warm runs by avoiding re-download of torch / transformers /
        # faster-whisper wheels.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install electron deps
        # Electron-builder needs the dev deps in electron/node_modules.
        # We don't run `npm install` at the monorepo root because the
        # other workspaces (apps/web, mobile, e2e) pull in heavy deps
        # that aren't needed for the desktop build.
        #
        # `--no-workspaces` is required: the monorepo root has no
        # package-lock.json (intentionally — see .gitignore). Without
        # this flag, npm walks up from electron/ to the root, sees the
        # workspaces declaration in the root package.json, and refuses
        # to install ("npm ci can only install with an existing
        # package-lock.json"). Treat electron/ as a standalone package.
        working-directory: electron
        run: npm ci --no-workspaces

      - name: Build native Python venv
        # The desktop app spawns `python -m uvicorn` from a venv bundled
        # at process.resourcesPath/AINT_Venv. The venv MUST be platform-
        # native — a macOS-built Mach-O python binary will not run on
        # Windows, and Windows .pyd files cannot be loaded by Linux
        # Python. So each runner builds its own venv here, named after
        # the runner OS:
        #   - ubuntu-latest  -> AINT_Venv_linux
        #   - macos-latest   -> AINT_Venv_macos
        #   - windows-latest -> AINT_Venv_windows
        # electron-builder then bundles the right one via the per-platform
        # extraResources entries in electron/package.json.
        #
        # Disk space: GitHub-hosted runners ship with ~14 GB free, and
        # the torch / transformers / faster-whisper stack routinely
        # pushes past that (see .github/workflows/ci.yml:189-196 for the
        # documented ML-deps disk concern in the e2e job). The
        # `pip cache` flag on setup-python avoids re-downloading wheels
        # on warm runs; the cache-clear step below reclaims ~500 MB
        # after the venv is built so electron-builder has room to work.
        #
        # shell: bash — the Windows runner defaults to PowerShell, but
        # the case/esac syntax + backslash path escapes below are POSIX-
        # bash. Force bash for cross-runner consistency.
        working-directory: backend
        shell: bash
        env:
          # Reuse the pip cache from the e2e job in ci.yml — same cache
          # key (backend/requirements.txt), so a dep change busts both.
          SETUPTOOLS_USE_DISTUTILS: "stdlib"
        run: |
          set -e
          case "$RUNNER_OS" in
            macOS)   VENV_DIR="../AINT_Venv_macos"  ; PY_BIN="$VENV_DIR/bin/python"      ;;
            Windows) VENV_DIR="..\\AINT_Venv_windows"; PY_BIN="$VENV_DIR\\Scripts\\python.exe" ;;
            Linux)   VENV_DIR="../AINT_Venv_linux"   ; PY_BIN="$VENV_DIR/bin/python"      ;;
          esac
          echo "Building venv at: $VENV_DIR (RUNNER_OS=$RUNNER_OS)"
          python -m venv "$VENV_DIR"
          "$PY_BIN" -m pip install --upgrade pip wheel
          "$PY_BIN" -m pip install -r requirements.txt
          echo "==> Installed packages:"
          "$PY_BIN" -m pip list 2>&1 | tail -n +3 | head -n 30
          echo "==> Venv size:"
          if [ "$RUNNER_OS" = "Windows" ]; then
            du -sh "$VENV_DIR" 2>/dev/null || powershell -Command "Get-ChildItem -Recurse '$VENV_DIR' | Measure-Object -Property Length -Sum | Select-Object @{Name='MB';Expression={[math]::Round(\$_.Sum / 1MB, 1)}}"
          else
            du -sh "$VENV_DIR"
          fi

      - name: Clear caches before packaging
        # Free disk before electron-builder downloads Electron + extracts
        # ~1.5GB venv into the NSIS/AppImage/DMG temp dirs. Without this
        # the Windows runner runs out of disk (the 14GB limit is tight).
        #
        # shell: bash — Windows defaults to PowerShell; the if/fi + df
        # syntax below is POSIX. Force bash for cross-runner consistency.
        shell: bash
        run: |
          python -m pip cache purge 2>&1 || true
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get clean 2>&1 || true
            # Remove unused toolchains preinstalled on ubuntu-latest.
            rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          fi
          echo "==> Disk free after cleanup:"
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -Command "Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{Name='FreeGB';Expression={[math]::Round(\$_.Free / 1GB, 2)}}"
          else
            df -h
          fi

      - name: Generate icons (Linux/macOS only — Windows doesn't need .ico)
        # electron-builder will fall back to the default Electron icon
        # if `assets/icon.ico` is missing on Windows, but `assets/icon.icns`
        # is required for the macOS DMG. Generate both for safety.
        #
        # shell: bash — the Windows runner defaults to PowerShell, but
        # the `if [ ! -f ... ]` test is POSIX-bash syntax. On Windows
        # the if-guard evaluates to false anyway (icon.ico + icon.icns
        # are both committed), so the step is a no-op there — but the
        # parse error still aborts the step. Force bash to keep the
        # step syntactically valid across all 3 runners.
        working-directory: electron
        shell: bash
        run: |
          if [ ! -f assets/icon.ico ] || [ ! -f assets/icon.icns ]; then
            npm install --no-save sharp png-to-ico
            npm run icons
          fi

      - name: Build installers
        working-directory: electron
        env:
          # Disable code signing on CI — releases are unsigned.
          # CSC_LINK / CSC_KEY_PASSWORD are empty; electron-builder
          # skips signing when both are unset.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Skip macOS notarization (we're unsigned).
          APPLE_ID: ''
          APPLE_APP_SPECIFIC_PASSWORD: ''
          APPLE_TEAM_ID: ''
          # electron-builder sees a `publish` block in electron/package.json
          # and demands GH_TOKEN. We don't want it publishing during the
          # build (the dedicated `publish` job below attaches assets via
          # softprops/action-gh-release). Setting GH_TOKEN here suppresses
          # the "Personal Access Token is not set" error that otherwise
          # breaks macOS builds. `--publish never` on the build command
          # (below) ensures electron-builder never tries to push even
          # with a token set.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN || 'unused' }}
        # Build only the platform matching this matrix runner. The
        # earlier `electron-builder -mwl` invocation built all three
        # platforms on every runner — wasteful (3x downloads of
        # Electron + native deps) and caused the publish job to receive
        # three overlapping artifact bundles, which
        # softprops/action-gh-release@v2 then refused to attach with
        # `fail_on_unmatched_files: true`. Per-runner targets keep the
        # artifact sets disjoint.
        run: npx electron-builder ${{ matrix.build_target }} --publish never

      - name: List dist output (sanity check)
        # NOTE: this step is informational only. The earlier
        # `ls -lh ${{ matrix.artifact_glob }}` approach failed in CI
        # because (a) the YAML value for artifact_glob is multi-line,
        # which GitHub Actions interpolated as actual newlines into
        # the shell script — splitting one bash line into four; and
        # (b) `bash -e` then exited on the first failed `ls`. We
        # sidestep both by just listing `dist/` directly.
        #
        # shell: bash — Windows runner defaults to PowerShell, but
        # the find/ls idiom below is bash syntax. Same reason as the
        # icon-gen step above.
        working-directory: electron
        shell: bash
        run: |
          echo "==> dist/ contents:"
          ls -lh dist/ 2>&1 || true
          echo "==> installer files:"
          find dist -maxdepth 1 -type f \( -name "*.tar.gz" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.exe" \) -exec ls -lh {} \; || true

      - name: Upload artifacts (for the upload job to consume)
        # NOTE: `path` accepts a YAML literal scalar — each line is
        # a separate glob. The earlier form
        #   path: |
        #     electron/dist/${{ matrix.artifact_glob }}
        #     electron/dist/SHA256SUMS.txt
        # failed because `matrix.artifact_glob` itself is multi-line,
        # so the interpolation only prefixed `electron/dist/` onto
        # the FIRST glob line, leaving the rest as bare relative
        # paths (which resolved against `electron/`, not
        # `electron/dist/`, and matched nothing).
        #
        # The fix: bake `electron/dist/` into every matrix glob so
        # the path here can be a simple list with no interpolation.
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            ${{ matrix.artifact_glob }}
            electron/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  # ───────────────────────────────────────────────────────────
  # Stage 2: take all 3 artifact bundles, attach to the release.
  # Runs only after every matrix job succeeds.
  # ───────────────────────────────────────────────────────────
  publish:
    name: Publish to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show what we got
        run: |
          echo "==> artifacts/ contents:"
          ls -lh artifacts/ || true

      - name: Generate SHA256SUMS.txt (combine with anything the build produced)
        # The download-artifact step (above) extracts the matrix
        # zips directly into `artifacts/` (the path strip happens
        # because each upload-artifact's path was rooted at
        # `electron/dist/`, but download-artifact collapses that
        # to the basename of the matched file). Compute SHA256
        # across all of them, then attach the resulting file to
        # the release.
        #
        # NB: an earlier version used `working-directory:
        # artifacts/electron/dist` — that path doesn't exist on
        # this job because the upload globs already include the
        # full `electron/dist/` prefix (see matrix.artifact_glob),
        # so download-artifact sees the installer's basename only.
        working-directory: artifacts
        run: |
          # Recompute hashes from the files we have on disk
          sha256sum *.exe *.dmg *.tar.gz *.zip *.AppImage *.deb 2>/dev/null > SHA256SUMS.txt || true
          echo "==> SHA256SUMS.txt:"
          cat SHA256SUMS.txt

      - name: Delete any pre-existing release assets
        # Race-condition guard for softprops/action-gh-release@v2.
        #
        # When the release already exists from a prior CI run (which
        # is the normal case for re-tagged releases), the upload
        # action tries to delete-then-replace each stale asset in
        # parallel with uploading the new ones. The parallel API
        # writes collide: GitHub returns
        #   Validation Failed: ... code: "already_exists" ... field: "name"
        # for one or more of the new uploads, and the step reports
        # failure even though the mac assets usually land.
        #
        # Pre-deleting each existing asset sequentially (single-threaded
        # GitHub API calls) eliminates the race so the upload step
        # only ever sees an empty release. Each `gh api` call returns
        # 204 on success; `|| true` makes a 404 (asset already gone)
        # non-fatal so a first-run release also works.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "==> Removing any pre-existing assets on v${{ github.ref_name }}..."
          # Find the release by tag via the list endpoint. The
          # `/releases/tags/<tag>` endpoint returns 404 for force-
          # pushed tags within a small window (GitHub's tag index
          # lags a few seconds behind force-pushes); filtering the
          # list endpoint is more reliable.
          #
          # Then iterate every asset under that release — including
          # ones still in the `starter` state (GitHub's virus-scan
          # queue). Hitting `/releases/{id}` only returns assets
          # already past that scan, which would miss the 3 we most
          # want to replace.
          release_id=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.tag_name=="v${{ github.ref_name }}") | .id' \
            2>/dev/null | head -n1)
          if [ -z "$release_id" ]; then
            echo "  (no existing release for v${{ github.ref_name }}; nothing to delete)"
          else
            echo "  release id: $release_id"
            gh api "repos/${{ github.repository }}/releases/$release_id/assets" \
              --jq '.[]?.id' \
            | while read -r asset_id; do
                [ -z "$asset_id" ] && continue
                echo "  - deleting asset $asset_id"
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$asset_id" \
                  >/dev/null || true
              done
          fi
          echo "==> Done."

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Don't overwrite an existing release body — if the tag was
          # pushed via `gh release create` first (preferred), the body
          # is already curated. Only attach files.
          #
          # NOTE: each matrix runner's upload-artifact zips up
          # `electron/dist/<installer>` files with the `electron/dist/`
          # path preserved. download-artifact@v4 (with merge-multiple)
          # extracts them all into the same `artifacts/` directory;
          # the `electron/dist/` prefix is dropped because the action
          # normalizes the path to the matched files' basename. So
          # the installers end up directly in `artifacts/` and the
          # release-upload globs target them there.
          files: |
            artifacts/*.exe
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/SHA256SUMS.txt
          # generate_release_notes: true appends GitHub's auto-generated
          # changelog (PR list + author credits) below whatever body
          # the maintainer wrote. Helpful, low-risk.
          generate_release_notes: true
          fail_on_unmatched_files: true
          # If the release doesn't exist yet, create it as a draft.
          # Maintainer promotes it to public via the web UI.
          draft: true
          # Auto-generated body. softprops/action-gh-release@v2 treats
          # `body:` as the literal release notes when the release is
          # created by the action — if the release already exists
          # (from a prior `gh release create` with curated notes), this
          # value is ignored on update. Kept short on purpose — it
          # tells users WHICH FILE to download for their OS, since
          # asset filenames alone (ANT.AI.Note.Taker.-2.1.8-mac-arm64.tar.gz)
          # aren't obvious to non-engineers. v2.1.8+.
          body: |
            ## ⬇️ Which file should I download?

            | Your system | File to download |
            |---|---|
            | **macOS — Apple Silicon (M1/M2/M3/M4)** | `ANT (AI Note Taker)-{{ github.ref_name }}-mac-arm64.tar.gz` |
            | **macOS — Intel** | `ANT (AI Note Taker)-{{ github.ref_name }}-mac-x64.tar.gz` |
            | **Windows 10/11 (64-bit)** | `ANT (AI Note Taker)-Setup-{{ github.ref_name }}-win-x64.exe` |
            | **Linux — Debian / Ubuntu** | `ANT (AI Note Taker)-{{ github.ref_name }}-linux-amd64.deb` |
            | **Linux — Universal (portable)** | `ANT (AI Note Taker)-{{ github.ref_name }}-linux-x86_64.AppImage` |

            Not sure which Mac you have? Apple menu → About This Mac. If it says "Apple M1/M2/M3/M4" → arm64. If it says "Intel" → x64.

            Verify your download with `SHA256SUMS.txt` (also attached).

            ## 🍎 macOS install (3 steps, no scripts)

            The macOS app is **unsigned** (we don't have an Apple Developer ID). Install in 3 steps:

            1. **Download** `ANT (AI Note Taker)-{{ github.ref_name }}-mac-arm64.tar.gz`
            2. **Double-click** it in Finder — it extracts to `ANT (AI Note Taker).app`
            3. **Drag** `ANT (AI Note Taker).app` to `/Applications`, then double-click to launch

            macOS may show a one-time dialog ("ANT is from an unidentified developer") because the app is unsigned. Click **Open** — that's it, it won't ask again.

            If you downloaded with Chrome (which tags archives with `com.apple.quarantine`), the extracted `.app` will carry that attribute even after you move it to `/Applications`. The Gatekeeper dialog handles this — just click Open. If you'd rather skip the dialog entirely, paste this once in Terminal:

            ```
            xattr -dr com.apple.quarantine "/Applications/ANT (AI Note Taker).app"
            ```

            See the changelog below for what changed.