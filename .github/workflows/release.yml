name: Release

on:
  push:
    branches: ['release/**']
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            target: --linux --x64
            artifacts: |
              electron/dist/*.AppImage
              electron/dist/*.deb
          - os: windows-2022
            platform: win32-x64
            target: --win --x64
            artifacts: electron/dist/*.exe
          - os: macos-15
            platform: darwin-arm64
            target: --mac --arm64
            artifacts: electron/dist/*-mac-arm64.zip
          - os: macos-15-intel
            platform: darwin-x64
            target: --mac --x64
            artifacts: electron/dist/*-mac-x64.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify version and release notes
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const root = require('./package.json');
          const desktop = require('./electron/package.json');
          const lock = require('./package-lock.json');
          const desktopLock = require('./electron/package-lock.json');
          const version = root.version;
          if ([desktop.version, lock.version, lock.packages[''].version,
               lock.packages.electron.version, desktopLock.version,
               desktopLock.packages[''].version].some(value => value !== version)) {
            throw new Error('Release versions and lockfiles do not match');
          }
          if (process.env.RELEASE_REF_TYPE === 'tag' && process.env.RELEASE_REF !== `v${version}`) {
            throw new Error('Tag does not match the app version');
          }
          if (!fs.existsSync(`docs/releases/${version}.md`)) throw new Error('Missing release notes');
          JS

      - name: Install locked JavaScript dependencies
        run: npm ci --no-fund
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low
      - name: Check desktop runtime resolution and web build
        run: |
          node --test electron/tests/python-runtime.test.js
          npm run web:build
      - name: Build standalone Python runtime
        run: python scripts/build_desktop_runtime.py
      - name: Audit bundled Python dependencies
        run: |
          python -m pip install pip-audit
          python - <<'PY'
          import pathlib, subprocess, sys
          root = pathlib.Path('AINT_Python')
          site = root / ('Lib/site-packages' if sys.platform == 'win32' else 'lib/python3.12/site-packages')
          subprocess.run([sys.executable, '-m', 'pip_audit', '--path', str(site), '--format', 'json', '--output', 'runtime-audit.json'], check=True)
          PY
      - name: Build installers for the native architecture
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Verify the actual packaged runtime and sign-in
        run: python scripts/verify_desktop_package.py
      - name: Upload verified installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload runtime audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-audit-${{ matrix.platform }}
          path: runtime-audit.json
          if-no-files-found: ignore
          retention-days: 14

  draft:
    name: Assemble release draft
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: artifacts
          merge-multiple: true
      - name: Verify asset set and calculate checksums
        run: python scripts/release_checksums.py artifacts
      - name: Create draft with reviewed notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft \
            --title "ANT $version" --notes-file "docs/releases/$version.md" "${flags[@]}"
