# ANT AI Note Taker - Continuous Deployment Pipeline
# Deploys to staging/production using OIDC (no long-lived cloud credentials)
# Integrates: Terraform, Helm, Argo Rollouts (canary), OPA Gatekeeper

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Image tag to deploy (defaults to the tested commit SHA)'
        required: false
        type: string
      rollout_strategy:
        description: 'Rollout strategy'
        required: false
        type: choice
        options:
          - rolling
          - blue-green
          - canary
        default: rolling

concurrency:
  group: cd-${{ github.ref }}-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  id-token: write   # Required for OIDC
  contents: read
  deployments: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository_owner }}/ant-backend
  AWS_REGION: us-east-1

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # PRE-DEPLOYMENT GATE
  # ═══════════════════════════════════════════════════════════════════════
  pre-deploy:
    name: Pre-Deployment Validation
    # Cloud templates require a configured, reviewed environment. A source
    # integration or failed CI run must not implicitly provision infrastructure.
    if: >-
      vars.ENABLE_CLOUD_DEPLOYMENTS == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.validate.outputs.environment }}
      can_deploy: ${{ steps.validate.outputs.can_deploy }}
      image_tag: ${{ steps.validate.outputs.image_tag }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
    steps:
      - name: Validate deployment
        id: validate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            TARGET_ENVIRONMENT="staging"
            IMAGE_TAG="$SOURCE_SHA"
          else
            TARGET_ENVIRONMENT="$REQUESTED_ENVIRONMENT"
            IMAGE_TAG="${REQUESTED_IMAGE_TAG:-$SOURCE_SHA}"
          fi
          case "$TARGET_ENVIRONMENT" in
            staging|production) ;;
            *) echo '::error::Invalid deployment environment'; exit 1 ;;
          esac
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::Invalid container image tag'
            exit 1
          fi
          echo "environment=$TARGET_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo 'can_deploy=true' >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════════════════════════════════
  # TERRAFORM INFRASTRUCTURE (AWS via OIDC)
  # ═══════════════════════════════════════════════════════════════════════
  infrastructure:
    name: Terraform (${{ needs.pre-deploy.outputs.environment }})
    runs-on: ubuntu-latest
    needs: [pre-deploy]
    if: needs.pre-deploy.outputs.can_deploy == 'true'
    environment: ${{ needs.pre-deploy.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre-deploy.outputs.source_sha }}
          persist-credentials: false

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-CD-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.7.0'
          terraform_wrapper: false

      - name: Terraform Init
        id: init
        env:
          STATE_BUCKET: ${{ secrets.TERRAFORM_STATE_BUCKET }}
          TARGET_ENVIRONMENT: ${{ needs.pre-deploy.outputs.environment }}
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=aws/$TARGET_ENVIRONMENT/terraform.tfstate"
        working-directory: infrastructure/terraform/aws

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_environment: ${{ needs.pre-deploy.outputs.environment }}
          TF_VAR_image_tag: ${{ needs.pre-deploy.outputs.image_tag }}
        run: |
          terraform plan -out=tfplan -no-color
        working-directory: infrastructure/terraform/aws

      - name: Terraform Apply
        # Deny-by-default: production infrastructure is planned and uploaded
        # for review, but never auto-applied. Pair with a required-reviewers
        # protection rule on the GitHub 'production' environment.
        if: needs.pre-deploy.outputs.environment != 'production'
        run: terraform apply -auto-approve tfplan
        working-directory: infrastructure/terraform/aws

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tfplan-aws
          path: infrastructure/terraform/aws/tfplan
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════
  # HELM DEPLOYMENT
  # ═══════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to ${{ needs.pre-deploy.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [pre-deploy, infrastructure]
    if: needs.pre-deploy.outputs.can_deploy == 'true'
    environment:
      name: ${{ needs.pre-deploy.outputs.environment }}
      url: https://${{ needs.pre-deploy.outputs.environment }}.ant.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre-deploy.outputs.source_sha }}
          persist-credentials: false

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: '3.14.0'

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Configure Kubeconfig (AWS EKS)
        env:
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Verify OPA Gatekeeper constraints
        run: |
          # Fail the deploy if Gatekeeper is not enforcing policies.
          kubectl get constrainttemplates.gatekeeper.sh -o wide
          kubectl get constraints -o wide

      # ─── Backend Deployment ────────────────────────────────────────────
      - name: Deploy Backend Helm Chart
        env:
          TARGET_ENVIRONMENT: ${{ needs.pre-deploy.outputs.environment }}
          IMAGE_TAG: ${{ needs.pre-deploy.outputs.image_tag }}
        run: |
          helm upgrade --install ant-backend \
            ./k8s/helm/backend \
            --namespace ant \
            --create-namespace \
            --values "./k8s/helm/backend/values-$TARGET_ENVIRONMENT.yaml" \
            --set-string "image.tag=$IMAGE_TAG" \
            --wait --timeout 10m \
            --atomic \
            --cleanup-on-fail

      # ─── Canary Rollout (Production) ──────────────────────────────────
      - name: Canary Deployment (Production)
        if: needs.pre-deploy.outputs.environment == 'production' && github.event.inputs.rollout_strategy == 'canary'
        env:
          IMAGE_TAG: ${{ needs.pre-deploy.outputs.image_tag }}
        run: |
          # Use Argo Rollouts for canary deployment. If Argo is unavailable
          # the requested canary strategy cannot happen — fail loudly rather
          # than silently deploying with Helm defaults.
          kubectl argo rollouts set image ant-backend \
            "ant-backend=$REGISTRY/$IMAGE_NAME_BACKEND:$IMAGE_TAG" \
            --namespace ant

          # Monitor rollout progress
          kubectl argo rollouts get rollout ant-backend \
            --namespace ant --watch 2>/dev/null || true

      # ─── Smoke Tests ──────────────────────────────────────────────────
      - name: Run Smoke Tests
        run: |
          # Get backend service URL
          BACKEND_URL=$(kubectl get svc ant-backend \
            -n ant \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")

          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL=$(kubectl get svc ant-backend \
              -n ant \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "localhost")
          fi

          # Health check — the deploy is not healthy unless this passes
          echo "Testing health endpoint at https://$BACKEND_URL/health"
          if ! curl -sf --max-time 30 "https://$BACKEND_URL/health"; then
            if ! curl -sf --max-time 30 "http://$BACKEND_URL:8000/health"; then
              echo "::error::Health endpoint unreachable at $BACKEND_URL"
              exit 1
            fi
          fi

      # ─── Verify Deployment Health ──────────────────────────────────────
      - name: Verify Deployment Health
        run: |
          kubectl rollout status deployment/ant-backend \
            --namespace ant \
            --timeout=5m

          # Show pod status
          kubectl get pods -n ant -l app.kubernetes.io/name=ant-backend

  # ═══════════════════════════════════════════════════════════════════════
  # POST-DEPLOYMENT VERIFICATION
  # ═══════════════════════════════════════════════════════════════════════
  post-deploy:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: [pre-deploy, deploy]
    if: always() && needs.deploy.result != 'skipped'
    steps:
      - name: Datadog Synthetic Test
        if: needs.deploy.result == 'success' && env.DD_API_KEY != ''
        run: |
          jq -n --arg test_id "$DD_SYNTHETIC_TEST_ID" '{tests: [{public_id: $test_id}]}' > synthetic-request.json
          curl --fail-with-body --max-time 30 -X POST "https://api.datadoghq.com/api/v1/synthetics/trigger" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: $DD_API_KEY" \
            -H "DD-APPLICATION-KEY: $DD_APP_KEY" \
            --data @synthetic-request.json
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          DD_SYNTHETIC_TEST_ID: ${{ vars.DD_SYNTHETIC_TEST_ID }}
        continue-on-error: true

      - name: Notify Slack
        if: vars.ENABLE_DEPLOYMENT_NOTIFICATIONS == 'true' && env.SLACK_BOT_TOKEN != ''
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "${{ vars.DEPLOYMENT_CHANNEL || 'deployments' }}",
              "text": "ANT Deployment to ${{ needs.pre-deploy.outputs.environment }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment ${{ needs.deploy.result }}:*\n• Environment: ${{ needs.pre-deploy.outputs.environment }}\n• SHA: `${{ needs.pre-deploy.outputs.source_sha }}`\n• Image: `${{ needs.pre-deploy.outputs.image_tag }}`"
                  }
                }
              ]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      # Jobs with `environment` already create and update GitHub deployment
      # records. Do not post a status to a fabricated deployment ID here.
