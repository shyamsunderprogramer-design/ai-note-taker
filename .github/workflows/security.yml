# ANT AI Note Taker - Security Scanning Pipeline
# Daily scheduled + on-push + on-demand scanning
# Integrates: Snyk, Trivy, GitLeaks, Checkov, Bandit, OPA Conftest

name: Security Scan

on:
  schedule:
    - cron: '7 2 * * *'  # Daily at ~2:07 AM (off-peak)
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of scan'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - sca
          - sast
          - container
          - secrets
          - iac
          - policy
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'electron/**'
      - 'infrastructure/**'
      - 'docker/**'
      - 'k8s/**'
      - 'package*.json'
      - '.github/workflows/security.yml'

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository_owner }}/ant-backend

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # SNYK SCA (Software Composition Analysis)
  # ═══════════════════════════════════════════════════════════════════════
  snyk-sca:
    name: Dependency Scan (npm audit, optional Snyk)
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'sca' || github.event.inputs.scan_type == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Snyk (Python)
        if: env.SNYK_TOKEN != ''
        with:
          args: --file=backend/requirements.txt --package-manager=pip --json-file-output=snyk-python.json
        uses: snyk/actions/python@11b673cfb4b0dc0d860a1323caa199d54950dcce
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Audit locked Node dependencies
        run: npm audit --audit-level=low

      - name: Run Snyk (Node.js)
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce
        continue-on-error: true
        with:
          args: --severity-threshold=high --json-file-output=snyk-node.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-report
          path: snyk-*.json
          if-no-files-found: ignore
          retention-days: 30


  # ═══════════════════════════════════════════════════════════════════════
  # TRIVY CONTAINER SCAN
  # ═══════════════════════════════════════════════════════════════════════
  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'container' || github.event.inputs.scan_type == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image for scanning
        run: |
          docker build -t ant-backend:scan -f docker/Dockerfile.backend .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        with:
          image-ref: 'ant-backend:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          vuln-type: 'os,library'

      - name: Upload Trivy scan results to Security tab
        uses: github/codeql-action/upload-sarif@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Generate Trivy table report
        uses: aquasecurity/trivy-action@6abccf398f78b4c337599c0656f933d91efb91a0
        with:
          image-ref: 'ant-backend:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════
  # GITLEAKS SECRET DETECTION
  # ═══════════════════════════════════════════════════════════════════════
  secrets-scan:
    name: Secret Detection (GitLeaks)
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'secrets' || github.event.inputs.scan_type == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitLeaks Scan
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml

      - name: Upload GitLeaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════
  # CHECKOV IaC SECURITY SCAN
  # ═══════════════════════════════════════════════════════════════════════
  checkov-iac:
    name: IaC Security (Checkov)
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'iac' || github.event.inputs.scan_type == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov (Terraform)
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895
        continue-on-error: true
        with:
          directory: infrastructure/terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov-terraform

      - name: Run Checkov (Kubernetes)
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895
        continue-on-error: true
        with:
          directory: k8s
          framework: kubernetes
          output_format: sarif
          output_file_path: checkov-kubernetes

      - name: Upload Checkov Terraform results
        uses: github/codeql-action/upload-sarif@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          sarif_file: checkov-terraform/results_sarif.sarif
          category: checkov-terraform
        continue-on-error: true

      - name: Upload Checkov Kubernetes results
        if: always()
        uses: github/codeql-action/upload-sarif@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          sarif_file: checkov-kubernetes/results_sarif.sarif
          category: checkov-kubernetes
        continue-on-error: true

      - name: Preserve IaC reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-reports
          path: |
            checkov-terraform/
            checkov-kubernetes/
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════
  # OPA POLICY CHECKS (Conftest)
  # ═══════════════════════════════════════════════════════════════════════
  opa-policy:
    name: OPA Policy-as-Code
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'policy' || github.event.inputs.scan_type == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          wget -q https://github.com/open-policy-agent/conftest/releases/download/v0.53.0/conftest_0.53.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.53.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/

      - name: Create OPA policy directory
        run: mkdir -p .github/opa-policies

      - name: Validate Docker policies
        run: |
          conftest test docker/Dockerfile.backend \
            --policy .github/opa-policies/ \
            --output table || true
        continue-on-error: true

      - name: Validate Kubernetes policies
        run: |
          conftest test k8s/helm/backend/templates/ \
            --policy .github/opa-policies/ \
            --output table || true
        continue-on-error: true

      - name: Validate Terraform policies
        run: |
          for dir in infrastructure/terraform/*/; do
            if [ -d "$dir" ]; then
              echo "OPA policy check for $dir"
              conftest test "$dir" --policy .github/opa-policies/ --output table || true
            fi
          done
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════
  # BANDIT PYTHON SECURITY LINT
  # ═══════════════════════════════════════════════════════════════════════
  bandit:
    name: Bandit Python Security
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'sast' || github.event.inputs.scan_type == ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit bandit-sarif-formatter

      - name: Run Bandit
        run: |
          bandit -r . -c .bandit -f sarif -o bandit-results.sarif || true
        working-directory: ./backend

      - name: Upload Bandit results to Security tab
        uses: github/codeql-action/upload-sarif@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          sarif_file: backend/bandit-results.sarif
        continue-on-error: true

      - name: Upload Bandit artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-results.sarif
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════════════
  # DEPENDENCY REVIEW (PRs only)
  # ═══════════════════════════════════════════════════════════════════════
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  # ═══════════════════════════════════════════════════════════════════════
  # SECURITY SUMMARY
  # ═══════════════════════════════════════════════════════════════════════
  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [snyk-sca, trivy-scan, secrets-scan, checkov-iac, opa-policy, bandit]
    if: always()
    steps:
      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-reports

      - name: Generate summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Snyk SCA | ${{ needs.snyk-sca.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy Container | ${{ needs.trivy-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitLeaks Secrets | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Checkov IaC | ${{ needs.checkov-iac.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OPA Policy | ${{ needs.opa-policy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit Python | ${{ needs.bandit.result }} |" >> $GITHUB_STEP_SUMMARY
