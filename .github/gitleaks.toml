# GitLeaks configuration for AI Note Taker
# https://gitleaks.io/

# Keep the maintained default detectors. Exact reviewed false-positive
# fingerprints belong in .gitleaksignore; do not exempt whole test directories.
[extend]
useDefault = true

[[rules]]
  id = "ollama-cloud-api-key"
  description = "Ollama Cloud API Key"
  regex = '''(?i)ollama[_-]?cloud[_-]?api[_-]?key\s*=\s*[a-zA-Z0-9]{20,}'''
  tags = ["key", "ollama"]

[[rules]]
  id = "encryption-key"
  description = "Encryption Key"
  regex = '''(?i)encryption[_-]?key\s*=\s*[a-zA-Z0-9]{32,}'''
  tags = ["key", "encryption"]

[[rules]]
  id = "neo4j-password"
  description = "Neo4j Password"
  regex = '''(?i)neo4j[_-]?password\s*=\s*[a-zA-Z0-9!@#$%^&*]{8,}'''
  tags = ["key", "neo4j"]
