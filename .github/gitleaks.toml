# GitLeaks configuration for AI Note Taker
# https://gitleaks.io/

# Run the built-in gitleaks ruleset in addition to the custom rules below.
# Without this, only the 3 custom rules run and the default ruleset
# (API keys, tokens, private keys, etc.) is silently disabled.
[extend]
useDefault = true

[allowlist]
  description = "Global allow list for known false positives"
  paths = [
    '''backend/.env\.example$''',
    '''backend/tests/test_.*\.py$''',
    '''\.devsecops/.*$''',
  ]

  # NOTE: only place *token-shaped placeholders* here. Never allowlist
  # credential *values* repo-wide: `admin123` and friends live only in
  # test fixtures, which are already covered by the paths above.
  regexes = [
    '''localhost:\d+''',               # Local service URLs
    '''127\.0\.0\.1:\d+''',            # Local service URLs
    '''your-32-char-encryption-key''',  # Placeholder in .env.example
    '''your-ollama-cloud-api-key''',   # Placeholder in .env.example
    '''sk-\.\.\.''',                   # Masked API key placeholders
    '''sk-YOUR-OPENAI-API-KEY-HERE''', # .env.example placeholder
    '''sk-ant-YOUR-ANTHROPIC-API-KEY-HERE''', # .env.example placeholder
    '''YOUR-GOOGLE-API-KEY-HERE''',    # .env.example placeholder
    '''YOUR-GROQ-API-KEY-HERE''',      # .env.example placeholder
    '''YOUR-GITHUB-TOKEN-HERE''',      # .env.example placeholder
    '''AIza\.\.\.''',                  # Masked Google API key placeholders
    '''ghp_\.\.\.'',                  # Masked GitHub token placeholders
  ]

[[rules]]
  id = "ollama-cloud-api-key"
  description = "Ollama Cloud API Key"
  regex = '''(?i)ollama[_-]?cloud[_-]?api[_-]?key\s*=\s*[a-zA-Z0-9]{20,}'''
  tags = ["key", "ollama"]

[[rules]]
  id = "encryption-key"
  description = "Encryption Key"
  regex = '''(?i)encryption[_-]?key\s*=\s*[a-zA-Z0-9]{32,}'''
  tags = ["key", "encryption"]

[[rules]]
  id = "neo4j-password"
  description = "Neo4j Password"
  regex = '''(?i)neo4j[_-]?password\s*=\s*[a-zA-Z0-9!@#$%^&*]{8,}'''
  tags = ["key", "neo4j"]