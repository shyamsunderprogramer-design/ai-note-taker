<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title description">
  <title id="title">ANT system architecture</title>
  <desc id="description">In the default local setup, the Electron desktop and browser interface communicate with a FastAPI backend over HTTP, server-sent events and WebSocket audio. The backend uses local Whisper transcription, local Ollama inference and local storage. Electron also saves desktop settings and conversation history directly. Optional cloud AI providers receive selected prompts and images over HTTPS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526477"/></marker>
    <marker id="cloud-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b45309"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #152536; }
      .heading { font-size: 40px; font-weight: 700; }
      .sub { font-size: 22px; fill: #415267; }
      .region { font-size: 21px; font-weight: 700; letter-spacing: 1px; }
      .title { font-size: 27px; font-weight: 650; }
      .body { font-size: 22px; fill: #334155; }
      .label { font-size: 20px; fill: #415267; }
      .card { fill: #fff; stroke: #94a3b8; stroke-width: 1.5; }
      .wire { fill: none; stroke: #526477; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="960" fill="#fff"/>
  <text x="40" y="58" class="heading">ANT / System architecture</text>
  <text x="40" y="94" class="sub">Default local setup · desktop and browser share the web interface</text>

  <rect x="24" y="120" width="900" height="760" rx="20" fill="#f6f9fb" stroke="#b8c7d4" stroke-width="1.5"/>
  <text x="52" y="163" class="region">ON YOUR DEVICE</text>
  <rect x="952" y="120" width="304" height="760" rx="20" fill="#fffaf3" stroke="#c78531" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="978" y="163" class="region" style="fill:#92400e">OPTIONAL CLOUD</text>

  <!-- Local request/response paths. Desktop IPC stays inside the desktop card. -->
  <path class="wire" d="M242 340V382H362V420"/>
  <path class="wire" d="M682 340V382H568V420"/>
  <text x="76" y="405" class="label">HTTP · SSE · WebSocket</text>
  <text x="624" y="405" class="label">HTTP · SSE · WebSocket</text>
  <path class="wire" d="M330 575V620H172V650"/>
  <path class="wire" d="M462 575V650"/>
  <path class="wire" d="M600 575V620H752V650"/>
  <text x="72" y="606" class="label">Audio / transcript</text>
  <text x="487" y="614" class="label">Inference</text>
  <text x="680" y="606" class="label">Read / write</text>

  <!-- Electron also persists its own conversation files and settings. -->
  <path class="wire" d="M52 270H38V820H752V770"/>
  <rect x="169" y="788" width="320" height="28" fill="#f6f9fb"/>
  <text x="184" y="810" class="label">Desktop settings + history</text>

  <path d="M670 500H976" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 5" marker-start="url(#cloud-arrow)" marker-end="url(#cloud-arrow)"/>
  <text x="704" y="472" class="label" style="fill:#92400e">Optional HTTPS</text>
  <text x="720" y="539" class="label" style="fill:#92400e">Text + images</text>

  <rect x="52" y="195" width="380" height="145" rx="14" class="card"/>
  <text x="78" y="235" class="title">Electron desktop</text>
  <text x="78" y="274" class="body">Native capture + shortcuts</text>
  <text x="78" y="310" class="body">Shared web UI + preload IPC</text>

  <rect x="492" y="195" width="380" height="145" rx="14" class="card"/>
  <text x="518" y="235" class="title">Browser interface</text>
  <text x="518" y="274" class="body">HTML, CSS and JavaScript</text>
  <text x="518" y="310" class="body">Vite dev server :5173</text>

  <rect x="260" y="420" width="410" height="155" rx="14" fill="#e8f5f1" stroke="#287465" stroke-width="2"/>
  <text x="286" y="462" class="title">FastAPI + Python</text>
  <text x="286" y="505" class="body">Auth · AI routing · context</text>
  <text x="286" y="545" class="body">Local backend :8000</text>

  <rect x="52" y="650" width="240" height="120" rx="14" class="card"/>
  <text x="76" y="687" class="title">Whisper</text>
  <text x="76" y="722" class="body">Speech to text</text>
  <text x="76" y="751" class="label">faster-whisper</text>

  <rect x="342" y="650" width="240" height="120" rx="14" class="card"/>
  <text x="366" y="687" class="title">Local Ollama</text>
  <text x="366" y="722" class="body">Downloaded models</text>
  <text x="366" y="751" class="label">Local server :11434</text>

  <rect x="632" y="650" width="240" height="120" rx="14" class="card"/>
  <text x="656" y="687" class="title">SQLite + files</text>
  <text x="656" y="722" class="body">Accounts + history</text>
  <text x="656" y="751" class="label">Settings + local data</text>

  <rect x="976" y="400" width="256" height="200" rx="14" fill="#fff" stroke="#c78531" stroke-width="1.5"/>
  <text x="996" y="441" class="title">Cloud providers</text>
  <text x="996" y="480" class="body">Your own API keys</text>
  <text x="996" y="527" class="label">OpenAI · Anthropic</text>
  <text x="996" y="559" class="label">Google · Groq · others</text>

  <text x="978" y="697" class="body">Only when configured</text>
  <text x="978" y="731" class="body">and selected by</text>
  <text x="978" y="765" class="body">the provider route.</text>

  <text x="40" y="918" class="label">Local inference uses Ollama. Cloud routes send the selected context to external providers.</text>
  <text x="40" y="946" class="label">Initial model downloads need internet. Optional Neo4j, Redis and hosted deployments are not shown.</text>
</svg>
