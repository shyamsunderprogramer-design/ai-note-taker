<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }

    .header {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      padding: 16px;
      text-align: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      padding: 16px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }

    .status-dot.disconnected {
      background: #ef4444;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-size: 13px;
      color: #aaa;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat {
      background: rgba(255,255,255,0.05);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #3b82f6;
    }

    .stat-label {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.1);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.15);
    }

    .platforms {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .platforms-title {
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }

    .platform-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .platform-tag {
      background: rgba(59, 130, 246, 0.2);
      color: #3b82f6;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
    }

    .footer {
      padding: 12px 16px;
      background: rgba(0,0,0,0.2);
      font-size: 11px;
      color: #666;
      text-align: center;
    }

    .error-message {
      display: none;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .error-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🐜 ANT</div>
    <div class="subtitle">AI Note Taker</div>
  </div>

  <div class="content">
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <div class="status-text" id="statusText">Checking connection...</div>
    </div>

    <div class="error-message" id="errorMessage">
      Cannot connect to AI Note Taker. Please make sure the app is running.
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="jobsCount">-</div>
        <div class="stat-label">Jobs Saved</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="appsCount">-</div>
        <div class="stat-label">Applications</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn" id="openAppBtn">Open AI Note Taker</button>
      <button class="btn btn-secondary" id="viewJobsBtn">View Saved Jobs</button>
    </div>

    <div class="platforms">
      <div class="platforms-title">Supported Platforms</div>
      <div class="platform-list">
        <span class="platform-tag">LinkedIn</span>
        <span class="platform-tag">Indeed</span>
        <span class="platform-tag">Glassdoor</span>
        <span class="platform-tag">Greenhouse</span>
        <span class="platform-tag">Lever</span>
      </div>
    </div>
  </div>

  <div class="footer">
    v1.0.0 • Free & Open Source
  </div>

  <script src="popup.js"></script>
</body>
</html>
