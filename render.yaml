services:
  - type: web
    name: ant-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: FORCE_SQLITE
        value: "false"
      - key: EMBEDDING_ENABLED
        value: "false"
      - key: CLASSIFIER_ENABLED
        value: "false"
      - key: CLOUD_MODE
        value: "true"
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: AUTH_REQUIRED
        value: "true"
      - key: HTTPS_REQUIRED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_VERCEL_URL
        sync: false
      # AI provider keys (set at least one for cloud functionality)
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false