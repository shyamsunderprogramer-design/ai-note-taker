<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker - ANT</title>
    <link rel="stylesheet" href="style.css?v=25">
    <style>
        .hidden { display: none !important; }
        /* Job Tracker Page */
        .job-tracker-page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Fixed Header */
        .job-header-fixed {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary, #1a1a1a);
            border-bottom: 1px solid var(--border-color, #333);
            z-index: 100;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            -webkit-app-region: drag;
        }

        .job-back-arrow {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: var(--text-primary, #fff);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-app-region: no-drag;
        }

        .job-back-arrow:hover {
            background: rgba(255,255,255,0.1);
        }

        .job-header-content {
            flex: 1;
        }

        .job-header-title {
            font-size: 20px;
            font-weight: 600;
            margin: 0;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .job-header-subtitle {
            font-size: 12px;
            color: var(--text-secondary, #888);
            margin: 2px 0 0 0;
        }

        .job-header-actions {
            display: flex;
            gap: 10px;
            -webkit-app-region: no-drag;
        }

        .btn-add {
            background: linear-gradient(135deg, #10b981, #3b82f6);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        /* Scrollable Content */
        .job-content {
            flex: 1;
            overflow-y: auto;
            padding: 80px 20px 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-secondary, #1a1a1a);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border-color, #333);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary, #888);
            margin-top: 5px;
        }

        /* Pipeline View */
        .pipeline-container {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            overflow-x: auto;
        }

        @media (max-width: 1200px) {
            .pipeline-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .pipeline-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .pipeline-column {
            background: var(--bg-secondary, #1a1a1a);
            border-radius: 12px;
            border: 1px solid var(--border-color, #333);
            min-height: 200px;
        }

        .pipeline-header {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color, #333);
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pipeline-count {
            background: rgba(255,255,255,0.1);
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 13px;
        }

        .pipeline-items {
            padding: 10px;
        }

        .job-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color, #333);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .job-card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            background: rgba(255,255,255,0.05);
        }

        .job-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 8px;
        }

        .job-company {
            font-weight: 600;
            font-size: 14px;
        }

        .job-role {
            font-size: 13px;
            color: var(--text-secondary, #888);
            margin-bottom: 5px;
        }

        .job-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .job-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.05);
        }

        .job-tag.priority-high {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .job-tag.priority-medium {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }

        /* Add Job Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary, #1a1a1a);
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary, #888);
            font-size: 24px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color, #333);
            border-radius: 8px;
            background: var(--bg-primary, #0a0a0a);
            color: var(--text-primary, #fff);
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 500px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary, #888);
        }

        .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color, #333);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="job-tracker-page">
        <!-- Fixed Header -->
        <header class="job-header-fixed">
            <button class="job-back-arrow" onclick="window.location.href='index.html'">←</button>
            <div class="job-header-content">
                <h1 class="job-header-title">💼 Job Application Tracker</h1>
                <p class="job-header-subtitle">Track applications, interviews, and offers</p>
            </div>
            <div class="job-header-actions">
                <button class="btn-add" onclick="jobTracker.openModal()">
                    <span>+</span>
                    <span>Add Application</span>
                </button>
            </div>
        </header>

        <!-- Scrollable Content -->
        <main class="job-content">
            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">Total Applications</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statApplied">0</div>
                    <div class="stat-label">Applied</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statInterviews">0</div>
                    <div class="stat-label">Interviews</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statOffers">0</div>
                    <div class="stat-label">Offers</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="statResponse">0%</div>
                    <div class="stat-label">Response Rate</div>
                </div>
            </div>

            <!-- Pipeline -->
            <div class="pipeline-container" id="pipelineContainer">
                <!-- Populated by JS -->
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="loading">
                <div class="loading-spinner"></div>
                <p>Loading applications...</p>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state hidden">
                <div class="empty-icon">📋</div>
                <h2>No Applications Yet</h2>
                <p>Start tracking your job applications here</p>
            </div>
        </main>
    </div>

    <!-- Add Job Modal -->
    <div class="modal-overlay" id="addJobModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Add Application</h2>
                <button class="modal-close" onclick="jobTracker.closeModal()">×</button>
            </div>
            <form id="addJobForm" onsubmit="jobTracker.submitForm(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>Company *</label>
                        <input type="text" id="companyInput" required placeholder="e.g., Google">
                    </div>
                    <div class="form-group">
                        <label>Role *</label>
                        <input type="text" id="roleInput" required placeholder="e.g., Software Engineer">
                    </div>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="locationInput" placeholder="e.g., San Francisco, CA">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Status</label>
                        <select id="statusInput">
                            <option value="saved">Saved</option>
                            <option value="applied">Applied</option>
                            <option value="phone_screen">Phone Screen</option>
                            <option value="technical">Technical Interview</option>
                            <option value="onsite">Onsite</option>
                            <option value="offer">Offer</option>
                            <option value="accepted">Accepted</option>
                            <option value="rejected">Rejected</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="priorityInput">
                            <option value="high">High</option>
                            <option value="medium" selected>Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Salary Range</label>
                    <input type="text" id="salaryInput" placeholder="e.g., $120k - $150k">
                </div>
                <div class="form-group">
                    <label>Job URL</label>
                    <input type="url" id="urlInput" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notesInput" rows="3" placeholder="Any additional notes..."></textarea>
                </div>
                <button type="submit" class="btn-submit">Add Application</button>
            </form>
        </div>
    </div>

    <script src="js/core/auth-helper.js"></script>
    <script src="job-tracker.js"></script>
</body>
</html>
