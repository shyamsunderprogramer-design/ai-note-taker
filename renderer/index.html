<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>ANT (AI Note Taker)</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="hljs-github-dark.min.css">
  <!-- Modular CSS Architecture -->
  <link rel="stylesheet" href="css/main.css">
  <!-- Fallback: Original styles while transitioning -->
  <link rel="stylesheet" href="style.css?v=25">

  <script src="hljs.min.js"></script>
</head>
<body>
  <div class="shell" id="app">

    <!-- Header -->
    <header class="header-strip">
      <!-- Left: Stealth Button -->
      <div class="header-left">
        <button id="stealthBtn" class="stealth-btn" type="button">
          <span class="stealth-dot" id="stealthDot"></span>
          <span id="stealthLabel">Detectable</span>
        </button>
      </div>

      <!-- Center: Title + Status -->
      <div class="header-center">
        <span class="app-subtitle">ANT</span>
        <span class="app-title">AI Note Taker</span>
        <div id="backendStatusIndicator" class="backend-status" title="Backend Status">
          <span class="backend-status-dot"></span>
          <span class="backend-status-text"></span>
        </div>
      </div>

      <!-- Right: Menu + Window Controls -->
      <div class="header-right">
        <button id="menuBtn" class="win-btn" type="button" title="Settings">☰</button>
        <div class="traffic-lights">
          <button id="minBtn" class="traffic-btn traffic-min" title="Minimize">
            <span class="traffic-icon">&#567;</span>
          </button>
          <button id="maxBtn" class="traffic-btn traffic-max" title="Maximize">
            <span class="traffic-icon">&#9633;</span>
          </button>
          <button id="closeBtn" class="traffic-btn traffic-close" title="Close">
            <span class="traffic-icon">&#215;</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Controls Strip -->
    <div class="controls-strip">
      <div class="ctrl-group">
        <label>Mode</label>
        <select id="modeSelect">
          <option value="instant">Instant ⚡</option>
          <option value="adaptive">Adaptive</option>
          <option value="interview">Interview</option>
          <option value="code">Code</option>
        </select>
      </div>
      <div class="ctrl-group">
        <label>Model</label>
        <select id="modelSelect">
          <option value="auto">Auto</option>
        </select>
      </div>
    </div>

    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer">
      <!-- Messages will be rendered here -->
    </div>

    <!-- Input Strip -->
    <div class="input-strip">
      <button id="voiceBtn" class="voice-btn" title="Voice input">
        <span class="voice-icon">🎤</span>
      </button>
      <div class="input-wrapper">
        <textarea id="messageInput" placeholder="Type a message..." rows="1"></textarea>
      </div>
      <button id="sendBtn" class="send-btn" title="Send">
        <span>➤</span>
      </button>
    </div>

  </div>

  <!-- Settings Panel (Tabbed) -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <span class="settings-title">Settings</span>
      <button class="settings-close-btn" id="closeSettingsBtn">×</button>
    </div>

    <div class="settings-tabs">
      <button class="settings-tab active" data-tab="general">General</button>
      <button class="settings-tab" data-tab="providers">Providers</button>
      <button class="settings-tab" data-tab="models">Models</button>
      <button class="settings-tab" data-tab="data">Data</button>
    </div>

    <div class="settings-body">
      <!-- Tab content loaded dynamically -->
      <div class="settings-tab-content active" data-content="general">
        <p class="settings-placeholder">General settings...</p>
      </div>
      <div class="settings-tab-content" data-content="providers">
        <p class="settings-placeholder">Provider settings...</p>
      </div>
      <div class="settings-tab-content" data-content="models">
        <p class="settings-placeholder">Model settings...</p>
      </div>
      <div class="settings-tab-content" data-content="data">
        <p class="settings-placeholder">Data settings...</p>
      </div>
    </div>
  </div>

  <!-- App Menu -->
  <div class="app-menu" id="appMenu">
    <div class="app-menu-section">
      <div class="app-menu-item" data-action="new-chat">New Chat</div>
      <div class="app-menu-item" data-action="history">History</div>
      <div class="app-menu-item" data-action="export">Export</div>
      <div class="app-menu-item" data-action="clear">Clear</div>
    </div>
    <div class="app-menu-section">
      <div class="app-menu-item" data-action="cognitive-graph">Cognitive Graph</div>
      <div class="app-menu-item" data-action="pre-interview">Pre-Interview</div>
      <div class="app-menu-item" data-action="analytics">Analytics</div>
      <div class="app-menu-item" data-action="study-plan">Study Plan</div>
    </div>
    <div class="app-menu-section">
      <div class="app-menu-item" data-action="quit">Quit</div>
    </div>
  </div>

  <!-- Scripts -->
  <!-- During transition, use original app.js -->
  <script src="app.js?v=25"></script>
  <!--
    Future: Use modular JS
    <script type="module" src="js/main.js"></script>
  -->
</body>
</html>
