# ANT Backend - Production Environment Values
# For manual approval + canary deployments

environment: production

# ─── Replica Configuration ────────────────────────────────────────────────
replicaCount: 3

# ─── Image ────────────────────────────────────────────────────────────────
image:
  repository: ghcr.io/your-org/ant-backend
  tag: latest
  pullPolicy: IfNotPresent

# ─── Autoscaling ──────────────────────────────────────────────────────────
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPU: 70
  targetMemory: 80

# ─── Ingress ──────────────────────────────────────────────────────────────
ingress:
  enabled: true
  hostname: api.ant.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"

# ─── Resources ────────────────────────────────────────────────────────────
resources:
  limits:
    cpu: 2000m
    memory: 2Gi
    ephemeral-storage: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi
    ephemeral-storage: 100Mi

# ─── Pod Disruption Budget ────────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# ─── Pod Anti-Affinity ────────────────────────────────────────────────────
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - ant-backend
          topologyKey: topology.kubernetes.io/zone

# ─── Topology Spread ──────────────────────────────────────────────────────
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: ant-backend

# ─── Monitoring ───────────────────────────────────────────────────────────
metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s
  prometheusRule:
    enabled: true
    groups:
      - name: ant-backend
        rules:
          - alert: BackendDown
            expr: up{job="ant-backend"} == 0
            for: 1m
            labels:
              severity: critical
          - alert: HighLatency
            expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 2
            for: 5m
            labels:
              severity: warning
          - alert: HighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.01
            for: 5m
            labels:
              severity: warning

# ─── Environment ──────────────────────────────────────────────────────────
env:
  - name: AUTH_REQUIRED
    value: "true"
  - name: USE_SQLITE
    value: "false"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: ant-secrets
        key: database-url
