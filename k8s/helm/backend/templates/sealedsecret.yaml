{{- /*
  SealedSecret template for ANT Backend (Fix #25)

  Wired to .Values.sealedSecret. The deployment env vars reference a
  Kubernetes Secret named "ant-secrets" (see values.yaml env[] blocks
  with secretKeyRef). This template generates the SealedSecret manifest
  that the Sealed Secrets controller (https://github.com/bitnami-labs/sealed-secrets)
  will decrypt at apply time into a normal Secret.

  IMPORTANT — how to actually populate this:
    1. Install kubeseal: https://github.com/bitnami-labs/sealed-secrets#installing
    2. Create a regular Secret manifest (or use `kubectl create secret`)
    3. Pipe it through kubeseal:
         kubectl create secret generic ant-secrets \
           --from-literal=database-url=... \
           --from-literal=encryption-key=... \
           --dry-run=client -o yaml \
         | kubeseal --controller-name=sealed-secrets --controller-namespace=kube-system \
           --format yaml > ant-secrets.sealed.yaml
    4. Paste the resulting `.spec.encryptedData` block below
       (replacing the empty `{}` placeholder).

  Until the SealedSecret is populated with real data, the deployment
  will fail to start (env vars will be empty). The .enabled flag is
  true by default — set it to false in your environment values to skip
  applying this template until you have the encrypted payload.
*/ -}}
{{- if .Values.sealedSecret.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Values.sealedSecret.name | default "ant-secrets" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ant-backend.labels" . | nindent 4 }}
  {{- with .Values.sealedSecret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  template:
    type: Opaque
    metadata:
      name: {{ .Values.sealedSecret.name | default "ant-secrets" }}
      namespace: {{ .Release.Namespace }}
      {{- with .Values.sealedSecret.templateLabels }}
      labels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  # The encryptedData map is generated by `kubeseal` and pasted here.
  # Example shape (real values would be much longer — sealed secrets
  # are RSA-4096-encrypted blobs):
  #
  #   encryptedData:
  #     database-url: AgB...long-base64...==
  #     encryption-key: AgB...long-base64...==
  #     openai-api-key: AgB...long-base64...==
  #     anthropic-api-key: AgB...long-base64...==
  #     google-api-key: AgB...long-base64...==
  #     neo4j-password: AgB...long-base64...==
  #
  # Until you populate this, the deployment will start without these
  # env vars — see the comment block at the top of this file.
  encryptedData: {}
{{- end }}
