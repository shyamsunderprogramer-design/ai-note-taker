{{- /*
  ServiceAccount template for ANT Backend

  Wired to .Values.serviceAccount. The deployment template
  (deployment.yaml:35) already references this SA via
  `serviceAccountName: {{ include "ant-backend.serviceAccountName" . }}`
  — the helper at _helpers.tpl:54-60 returns either the name we create
  here (.Values.serviceAccount.create=true, default) or an externally
  provided name.

  Supports GKE Workload Identity via the
  `iam.gke.io/gcp-service-account` annotation. For AWS, use the
  `eks.amazonaws.com/role-arn` annotation. For Azure, use
  `azure.workload.identity/client-id`.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ant-backend.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ant-backend.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.serviceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
