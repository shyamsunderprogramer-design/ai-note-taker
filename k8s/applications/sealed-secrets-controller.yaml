# Sealed Secrets Controller — required for SealedSecret CRDs to work
# (see k8s/helm/backend/templates/sealedsecret.yaml).
#
# Installs the Bitnami Sealed Secrets controller as a GitOps
# application. Once installed, cluster admins can create SealedSecret
# resources that are decrypted only by the controller running in
# this cluster.
#
# Source: https://github.com/bitnami-labs/sealed-secrets

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets-controller
  namespace: argocd
  labels:
    app.kubernetes.io/name: sealed-secrets-controller
    app.kubernetes.io/part-of: infrastructure
spec:
  source:
    repoURL: https://github.com/bitnami-labs/sealed-secrets.git
    targetRevision: v0.27.1
    path: helm/sealed-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
